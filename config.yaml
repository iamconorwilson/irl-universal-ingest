rtmp:
  port: 1935

srt:
  port: 8890
  latency_ms: 200
  latency_max_ms: 5000
  # passphrase: ""
  # player_port: 8190
  # http_port: 8181
  # idle_timeout_sec: 5

srtla:
  port: 5000

rist:
  port: 5001
  buffer_ms: 1000
  profile: "main"
  # secret: ""

output:
  # In production, defaults to 127.0.0.1. For container-to-host UDP streaming in Windows/macOS Docker Desktop, use host.docker.internal.
  host: "host.docker.internal"
  port: 8888

source_timeout: "10s"
stats_port: 8080
log_level: "info"

auth:
  # List of allowed ingest paths across all protocols
  # An empty list permits all paths.
  allowed_paths:
    - "/live/stream"
